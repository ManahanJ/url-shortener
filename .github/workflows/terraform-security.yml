# Terraform Security and Quality Checks
# Runs tfsec, tflint, OPA, and other security validations

name: Terraform Security

on:
  push:
    branches: [main, dev, feat/*]
    paths:
      - 'terraform/**'
      - 'policy/**'
      - '.github/workflows/terraform-security.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'terraform/**'
      - 'policy/**'
      - '.github/workflows/terraform-security.yml'

env:
  TF_VERSION: "1.6.0"
  TFSEC_VERSION: "1.28.1"
  TFLINT_VERSION: "0.48.0"
  OPA_VERSION: "0.57.0"

jobs:
  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Setup tfsec
      run: |
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
        sudo mv tfsec /usr/local/bin/

    - name: Setup tflint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: ${{ env.TFLINT_VERSION }}

    - name: Setup OPA
      run: |
        curl -L -o opa https://openpolicyagent.org/downloads/v${{ env.OPA_VERSION }}/opa_linux_amd64_static
        chmod 755 ./opa
        sudo mv opa /usr/local/bin/

    - name: Cache Terraform modules
      uses: actions/cache@v3
      with:
        path: |
          terraform/envs/dev/.terraform
          terraform/envs/staging/.terraform
          terraform/envs/prod/.terraform
        key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/**/*.tf') }}

    - name: Terraform Format Check
      run: |
        cd terraform
        terraform fmt -check -recursive -diff

    - name: Terraform Init (Dev Environment)
      run: |
        cd terraform/envs/dev
        terraform init -backend=false

    - name: Terraform Validate (Dev Environment)
      run: |
        cd terraform/envs/dev
        terraform validate

    - name: tflint - Terraform Linting
      run: |
        cd terraform

        # Initialize tflint
        tflint --init

        # Run tflint on each environment
        echo "::group::tflint - Dev Environment"
        cd envs/dev && tflint --config ../../.tflint.hcl
        cd ../..
        echo "::endgroup::"

        # Run tflint on modules
        echo "::group::tflint - Modules"
        for module in modules/*; do
          if [ -d "$module" ]; then
            echo "Linting module: $module"
            cd "$module" && tflint --config ../../.tflint.hcl && cd ../..
          fi
        done
        echo "::endgroup::"

    - name: tfsec - Security Scanning
      run: |
        echo "::group::tfsec - Security Scan"
        tfsec terraform/ \
          --config-file terraform/.tfsec.yml \
          --format json \
          --out tfsec-results.json

        # Also generate human-readable output
        tfsec terraform/ \
          --config-file terraform/.tfsec.yml \
          --no-colour
        echo "::endgroup::"

    - name: OPA Policy Validation
      run: |
        echo "::group::OPA - Policy Validation"

        # Test OPA policies
        opa test policy/opa/

        # Generate Terraform plan for policy evaluation
        cd terraform/envs/dev
        terraform plan -out=tfplan.binary
        terraform show -json tfplan.binary > tfplan.json
        cd ../../..

        # Evaluate policies against plan
        echo "Evaluating security policies..."
        opa eval -d policy/opa/ \
          -i terraform/envs/dev/tfplan.json \
          "data.terraform.security.deny" \
          --format pretty

        echo "Evaluating tagging policies..."
        opa eval -d policy/opa/ \
          -i terraform/envs/dev/tfplan.json \
          "data.terraform.tagging.deny" \
          --format pretty

        echo "Evaluating networking policies..."
        opa eval -d policy/opa/ \
          -i terraform/envs/dev/tfplan.json \
          "data.terraform.networking.deny" \
          --format pretty

        echo "::endgroup::"

    - name: Upload Security Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          tfsec-results.json
          terraform/envs/dev/tfplan.json
        retention-days: 30

    - name: Comment PR with Security Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');

          let comment = '## 🔒 Terraform Security Scan Results\n\n';

          try {
            const tfsecResults = JSON.parse(fs.readFileSync('tfsec-results.json', 'utf8'));
            const failedChecks = tfsecResults.results?.filter(r => r.severity === 'HIGH' || r.severity === 'CRITICAL') || [];

            if (failedChecks.length === 0) {
              comment += '✅ **No high/critical security issues found**\n\n';
            } else {
              comment += `❌ **Found ${failedChecks.length} high/critical security issues**\n\n`;
              failedChecks.slice(0, 5).forEach(check => {
                comment += `- **${check.rule_id}**: ${check.description}\n`;
                comment += `  - File: \`${check.location.filename}:${check.location.start_line}\`\n`;
                comment += `  - Severity: ${check.severity}\n\n`;
              });

              if (failedChecks.length > 5) {
                comment += `... and ${failedChecks.length - 5} more issues. Check the full report in Actions.\n\n`;
              }
            }
          } catch (error) {
            comment += '⚠️ Could not parse tfsec results\n\n';
          }

          comment += '📊 **Full security report available in the GitHub Actions artifacts**';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-security
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Plan (Dev)
      run: |
        cd terraform/envs/dev
        terraform init -backend=false
        terraform plan -var-file=terraform.tfvars.example -out=tfplan

        # Convert plan to human-readable format
        terraform show tfplan > plan-output.txt

    - name: Comment PR with Plan
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('terraform/envs/dev/plan-output.txt', 'utf8');

          const comment = `## 📋 Terraform Plan (Dev Environment)

          <details>
          <summary>Click to expand plan</summary>

          \`\`\`hcl
          ${plan}
          \`\`\`

          </details>

          💡 Plan generated from \`terraform.tfvars.example\`. Actual deployment may differ based on environment-specific variables.`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Upload Plan
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan
        path: terraform/envs/dev/plan-output.txt
        retention-days: 30